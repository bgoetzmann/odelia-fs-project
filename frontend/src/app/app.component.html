<header class="app-header">
  <h1>Kanban</h1>
  <span class="tagline">Signed in with Keycloak, every board is private</span>

  @if (auth.authenticated()) {
    <div class="account">
      <span class="user">{{ auth.username() }}</span>
      @if (auth.isAdmin()) {
        <span class="badge">admin</span>
      }
      <button type="button" class="sign-out" (click)="auth.logout()">Sign out</button>
    </div>
  }
</header>

<main>
  <router-outlet />
</main>
