services:
  postgres:
    image: postgres:16
    container_name: kanban-postgres
    environment:
      POSTGRES_DB: kanban
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanban -d kanban"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Imports every file under the mounted data/import directory at startup, so
  # keycloak/kanban-realm.json becomes the "kanban" realm (day 3). The admin
  # console is on http://localhost:8081 with admin/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kanban-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8081:8080"

  backend:
    build: ./backend
    container_name: kanban-backend
    depends_on:
      postgres:
        condition: service_healthy
      # Only "started": the backend fetches Keycloak's public keys lazily, the
      # first time a token turns up, so it does not have to wait for the realm.
      keycloak:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: kanban
      DB_USER: kanban
      DB_PASSWORD: kanban
      # The mp.jwt.* defaults in microprofile-config.properties already point at
      # http://keycloak:8080 (this network) and expect tokens issued to the
      # browser by http://localhost:8081; override them here if that changes.
    ports:
      - "9080:9080"
      - "9443:9443"

volumes:
  postgres-data:
