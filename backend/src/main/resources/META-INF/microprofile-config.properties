# MicroProfile Config.
#
# Everything MicroProfile JWT needs to validate the Keycloak tokens the
# Angular app sends. Any of these can be overridden by an environment variable
# with the same name in upper case and dots replaced by underscores (the
# environment config source has a higher ordinal than this file), e.g.
#   MP_JWT_VERIFY_PUBLICKEY_LOCATION=http://localhost:8081/realms/kanban/protocol/openid-connect/certs
# which is what you need when the backend runs on the host instead of in Docker.

# Where the public keys that verify the token signature are fetched from.
# Server-to-server call inside the Docker network, hence "keycloak:8080".
mp.jwt.verify.publickey.location=http://keycloak:8080/realms/kanban/protocol/openid-connect/certs

# The "iss" claim Keycloak stamps into the token. It is the URL the *browser*
# used to sign in, which is why it says localhost:8081 and not keycloak:8080 -
# a classic mismatch to get wrong when the two run on different networks.
mp.jwt.verify.issuer=http://localhost:8081/realms/kanban

# The "aud" claim, put there by the "kanban-app audience" protocol mapper in
# keycloak/kanban-realm.json. Without that mapper Keycloak only sends
# aud=account and the token is rejected here.
mp.jwt.verify.audiences=kanban-app
